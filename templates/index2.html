<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #667eea; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 100%; }
        .header { background: #667eea; color: white; padding: 40px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .form-wrapper { padding: 40px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
        button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #5568d3; }
        .result { margin-top: 30px; padding: 20px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
        .result.show { display: block; }
        .result.positive { background: #fee; color: #c33; border: 2px solid #fcc; }
        .result.negative { background: #efe; color: #3c3; border: 2px solid #cfc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❤️ Heart Disease Prediction</h1>
            <p>Advanced Medical Assessment System</p>
        </div>

        <div class="form-wrapper">
            <form id="predictionForm">
                <h3 style="margin-bottom: 20px;">Patient Information</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="male" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Age (years)</label>
                        <input type="number" name="age" min="1" max="120" placeholder="35" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Current Smoker?</label>
                        <select name="currentSmoker" required>
                            <option value="">Select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cigarettes/Day</label>
                        <input type="number" name="cigsPerDay" min="0" step="0.1" placeholder="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>BP Medication?</label>
                        <select name="BPMeds" required>
                            <option value="">Select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stroke History?</label>
                        <select name="prevalentStroke" required>
                            <option value="">Select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Hypertension?</label>
                        <select name="prevalentHyp" required>
                            <option value="">Select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Diabetes?</label>
                        <select name="diabetes" required>
                            <option value="">Select</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Total Cholesterol (mg/dL)</label>
                        <input type="number" name="totChol" min="0" step="0.1" placeholder="200" required>
                    </div>
                    <div class="form-group">
                        <label>Systolic BP (mmHg)</label>
                        <input type="number" name="sysBP" min="0" step="0.1" placeholder="120" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Diastolic BP (mmHg)</label>
                        <input type="number" name="diaBP" min="0" step="0.1" placeholder="80" required>
                    </div>
                    <div class="form-group">
                        <label>BMI (kg/m²)</label>
                        <input type="number" name="BMI" min="0" step="0.1" placeholder="25" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Heart Rate (bpm)</label>
                        <input type="number" name="heartRate" min="0" step="0.1" placeholder="70" required>
                    </div>
                    <div class="form-group">
                        <label>Glucose (mg/dL)</label>
                        <input type="number" name="glucose" min="0" step="0.1" placeholder="100" required>
                    </div>
                </div>

                <button type="submit">🔍 Analyze Health Status</button>
            </form>

          <div class="result" id="resultContainer">

    <p id="resultText"></p>

    <div id="xaiSection">
        <h3>XAI Visualization</h3>

        <img id="shapImg"
             style="width:100%;
                    margin-top:10px;
                    display:none;" />
    </div>

</div>
        </div>
    </div>

   <script>
document.getElementById('predictionForm').addEventListener('submit', async (e) => {

    e.preventDefault();

    const formData = new FormData(document.getElementById('predictionForm'));

    try {

        const response = await fetch('/predict', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        console.log("Response:", data);

        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const xaiSection = document.getElementById('xaiSection');

        if (data.error) {

            resultText.innerHTML = "❌ " + data.error;
            return;
        }

        // Prediction text
        resultText.innerHTML = data.prediction;

        // Explanation HTML
        let explanationHTML = `
            <h3>Why this prediction?</h3>
            <ul>
        `;

        data.explanation.forEach(item => {
            explanationHTML += `<li>${item}</li>`;
        });

        explanationHTML += `
            </ul>

            <h3>XAI Visualization</h3>
        `;

        // SHAP image (IMPORTANT FIX)
        if (data.shap_plot) {
            explanationHTML += `
                <img src="${data.shap_plot}?t=${new Date().getTime()}" width="100%">
            `;
        }

        xaiSection.innerHTML = explanationHTML;

        resultContainer.classList.add('show');

        if (data.prediction.includes('Detected')) {
            resultContainer.classList.add('positive');
            resultContainer.classList.remove('negative');
        } else {
            resultContainer.classList.add('negative');
            resultContainer.classList.remove('positive');
        }

    } catch (error) {

        console.log("Frontend error:", error);
        alert("Something went wrong. Check console (F12).");
    }
});
</script>
</body>
</html>
